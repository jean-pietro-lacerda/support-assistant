services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?Defina DB_NAME no .env}
      POSTGRES_USER: ${DB_USER:?Defina DB_USER no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/001-executions.sql:/docker-entrypoint-initdb.d/001-executions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CHAVE_API_LLM: ${CHAVE_API_LLM:?Defina CHAVE_API_LLM no .env}
      GROQ_MODEL: ${GROQ_MODEL:?Defina GROQ_MODEL no .env}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?Defina DB_NAME no .env}
      DB_USER: ${DB_USER:?Defina DB_USER no .env}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; from services.database import conectar; urllib.request.urlopen('http://127.0.0.1:8001/customers', timeout=3).close(); c = conectar(); c.execute('SELECT 1 FROM executions LIMIT 1'); c.close()"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8001
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
